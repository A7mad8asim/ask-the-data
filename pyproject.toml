[project]
name = "ask-the-data"
version = "0.1.0"
description = "Bilingual (Arabic/English) text-to-SQL assistant for clinic analytics, with a SQL sandbox, privacy rules and an evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "sqlglot>=25",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "requests>=2.32",
  "anthropic>=1.0,<2",
  "streamlit>=1.40,<2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
askdata = "askdata.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
