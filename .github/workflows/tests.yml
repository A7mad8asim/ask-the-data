name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Unit tests, sandbox red-team tests, gold-set checks, and the harness run with the gold-SQL oracle.
      # They build their own small seeded database, so no data or model is needed in CI.
      - run: pytest
